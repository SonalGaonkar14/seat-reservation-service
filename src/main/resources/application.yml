spring:
  application:
    name: seat-reservation
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:seatdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
app:
  per-user-limit: ${PER_USER_LIMIT:4}
  admin-token: ${ADMIN_TOKEN:admin-secret}
  user-token-prefix: ${USER_TOKEN_PREFIX:user-}
